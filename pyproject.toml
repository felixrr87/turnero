[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnero"
version = "0.1.0"
description = "Límite de peticiones por ventana y agrupación de llamadas idénticas, para asyncio."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Félix Ramírez Ramírez" }]
keywords = ["rate-limit", "asyncio", "sliding-window", "single-flight", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/turnero"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
