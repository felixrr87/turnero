# Las pruebas en cada push y en cada pull request.
#
# En un repositorio PÚBLICO los minutos de GitHub Actions con los
# runners estándar son gratis e ilimitados. Por eso este fichero no
# cuesta dinero y el repositorio es público a propósito.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
